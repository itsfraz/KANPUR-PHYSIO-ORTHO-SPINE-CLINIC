<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <defs>
    <linearGradient id="wallGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="300" height="180" fill="url(#wallGrad2)" />
  <line x1="0" y1="130" x2="300" y2="130" stroke="#bae6fd" stroke-width="2" />
  <rect x="0" y="130" width="300" height="50" fill="#f0f9ff" />

  <!-- Posture Grid on Wall -->
  <g stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3">
    <line x1="30" y1="20" x2="30" y2="120" />
    <line x1="50" y1="20" x2="50" y2="120" />
    <line x1="70" y1="20" x2="70" y2="120" />
    <line x1="90" y1="20" x2="90" y2="120" />
    <line x1="20" y1="35" x2="100" y2="35" />
    <line x1="20" y1="60" x2="100" y2="60" />
    <line x1="20" y1="85" x2="100" y2="85" />
    <line x1="20" y1="110" x2="100" y2="110" />
  </g>

  <!-- Swiss / Exercise Ball -->
  <circle cx="160" cy="115" r="28" fill="#0284c7" />
  <ellipse cx="155" cy="102" rx="10" ry="6" fill="#38bdf8" opacity="0.6" />

  <!-- Dumbbell / Weights Rack -->
  <rect x="220" y="90" width="60" height="42" rx="4" fill="#334155" />
  <circle cx="235" cy="102" r="6" fill="#14b8a6" />
  <rect x="233" y="100" width="18" height="4" fill="#64748b" />
  <circle cx="249" cy="102" r="6" fill="#14b8a6" />

  <circle cx="233" cy="118" r="8" fill="#f59e0b" />
  <rect x="231" y="116" width="22" height="4" fill="#64748b" />
  <circle cx="251" cy="118" r="8" fill="#f59e0b" />

  <!-- Label Overlay -->
  <rect x="65" y="145" width="170" height="24" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="150" y="161" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">REHABILITATION BAY</text>
</svg>

