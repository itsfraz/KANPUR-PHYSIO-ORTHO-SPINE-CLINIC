<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <!-- Background Room -->
  <rect x="0" y="0" width="300" height="180" fill="url(#wallGrad)" />
  <line x1="0" y1="130" x2="300" y2="130" stroke="#cbd5e1" stroke-width="2" />
  <!-- Floor -->
  <rect x="0" y="130" width="300" height="50" fill="#f1f5f9" />

  <!-- Medical Cross on Wall -->
  <rect x="135" y="25" width="30" height="30" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" />
  <path d="M 150 32 L 150 48 M 142 40 L 158 40" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />

  <!-- Physical Therapy Treatment Bed -->
  <!-- Pillow -->
  <rect x="45" y="88" width="25" height="10" rx="3" fill="#ffffff" stroke="#94a3b8" />
  <!-- Mattress / Bed Top -->
  <rect x="40" y="96" width="220" height="16" rx="6" fill="url(#bedGrad)" />
  <!-- Frame & Legs -->
  <rect x="55" y="112" width="10" height="38" rx="2" fill="#334155" />
  <rect x="235" y="112" width="10" height="38" rx="2" fill="#334155" />
  <!-- Crossbar -->
  <rect x="55" y="135" width="190" height="6" rx="2" fill="#64748b" />

  <!-- Label Overlay -->
  <rect x="65" y="145" width="170" height="24" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="150" y="161" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CLINIC TREATMENT AREA</text>
</svg>

